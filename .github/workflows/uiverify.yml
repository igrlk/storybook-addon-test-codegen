name: UI Verify

on:
  pull_request:
  workflow_dispatch:

# Read-only: the PR check itself is posted by the UI Verify GitHub App, not this job.
permissions:
  contents: read

concurrency:
  group: uiverify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so UI Verify can resolve the right baseline commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The addon is loaded from its own dist, and the preview imports a generated
      # tailwind.css, so both have to exist before Storybook builds.
      - run: pnpm build && pnpm tailwind && pnpm build-storybook
      - run: pnpm dlx uiverify@1.4.0 upload --static-dir ./storybook-static
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_API_KEY }}
